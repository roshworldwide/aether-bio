
services:
  postgres:
    image: postgres:15-alpine
    container_name: aether_core_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: aether_admin
      POSTGRES_PASSWORD: neural_password_2126
      POSTGRES_DB: aether_forge
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: